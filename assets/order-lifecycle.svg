<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="25" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="40" r="5" fill="#a855f7"/>
  <text x="60" y="45" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1">STATE MACHINE</text>

  <text x="30" y="85" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Order Lifecycle &amp; State Transitions</text>
  <text x="30" y="105" font-size="12" font-weight="400" fill="#94a3b8">Finite State Machine (FSM) with automated inventory rollback and refund accounting.</text>

  <!-- ==================== MAIN HAPPY PATH ==================== -->
  <!-- 1. PENDING -->
  <g transform="translate(40, 160)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="30" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">PENDING</text>
    <text x="65" y="46" font-size="9" fill="#94a3b8" text-anchor="middle">Stock Reserved</text>
  </g>

  <line x1="170" y1="190" x2="225" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="197" y="182" font-size="8" fill="#a7f3d0" text-anchor="middle">Payment</text>

  <!-- 2. CONFIRMED -->
  <g transform="translate(230, 160)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="30" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">CONFIRMED</text>
    <text x="65" y="46" font-size="9" fill="#94a3b8" text-anchor="middle">Payment Verified</text>
  </g>

  <line x1="360" y1="190" x2="415" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="387" y="182" font-size="8" fill="#a7f3d0" text-anchor="middle">Warehouse</text>

  <!-- 3. PROCESSING -->
  <g transform="translate(420, 160)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="30" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="middle">PROCESSING</text>
    <text x="65" y="46" font-size="9" fill="#94a3b8" text-anchor="middle">Picking &amp; Packing</text>
  </g>

  <line x1="550" y1="190" x2="605" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="577" y="182" font-size="8" fill="#a7f3d0" text-anchor="middle">Dispatch</text>

  <!-- 4. SHIPPED -->
  <g transform="translate(610, 160)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="30" font-size="12" font-weight="800" fill="#818cf8" text-anchor="middle">SHIPPED</text>
    <text x="65" y="46" font-size="9" fill="#94a3b8" text-anchor="middle">In Transit</text>
  </g>

  <line x1="740" y1="190" x2="795" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="767" y="182" font-size="8" fill="#a7f3d0" text-anchor="middle">Delivery</text>

  <!-- 5. DELIVERED -->
  <g transform="translate(800, 160)">
    <rect width="150" height="60" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="30" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">DELIVERED</text>
    <text x="75" y="46" font-size="9" fill="#a7f3d0" text-anchor="middle">Fulfilled &amp; Completed</text>
  </g>

  <!-- ==================== ALTERNATE BRANCHES ==================== -->
  <!-- CANCELLED NODE -->
  <g transform="translate(230, 290)">
    <rect width="150" height="65" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="28" font-size="12" font-weight="800" fill="#fca5a5" text-anchor="middle">CANCELLED</text>
    <text x="75" y="44" font-size="9" fill="#fecaca" text-anchor="middle">Stock Unreserved</text>
    <text x="75" y="56" font-size="8" fill="#f87171" text-anchor="middle">Terminal State</text>
  </g>

  <!-- REFUNDED NODE -->
  <g transform="translate(800, 290)">
    <rect width="150" height="65" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="28" font-size="12" font-weight="800" fill="#e9d5ff" text-anchor="middle">REFUNDED</text>
    <text x="75" y="44" font-size="9" fill="#f3e8ff" text-anchor="middle">Stock Returned to Shelf</text>
    <text x="75" y="56" font-size="8" fill="#c084fc" text-anchor="middle">Audit Log Written</text>
  </g>

  <!-- Cancellation Transition Paths -->
  <path d="M 105 220 L 105 320 L 225 320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 295 220 L 295 285" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 485 220 L 485 320 L 385 320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-red)"/>

  <!-- Refund Transition Path -->
  <path d="M 875 220 L 875 285" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-purple)"/>
  <text x="915" y="255" font-size="9" fill="#d8b4fe">Admin Refund</text>

  <text x="145" y="310" font-size="8" fill="#f87171">Cancel</text>
</svg>
