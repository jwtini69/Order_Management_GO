<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#38bdf8"/>
    </marker>
    <marker id="crow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 M 0 6 L 12 6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Header Section -->
  <rect x="30" y="25" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="40" r="5" fill="#38bdf8"/>
  <text x="60" y="45" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1">RELATIONAL SCHEMA</text>

  <text x="30" y="85" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">PostgreSQL Entity-Relationship Diagram (ERD)</text>
  <text x="30" y="108" font-size="13" font-weight="400" fill="#94a3b8">Normalized 3NF relational design with strict integrity, composite indexes, and audit logs.</text>

  <!-- ==================== TABLE: USERS ==================== -->
  <g transform="translate(40, 140)">
    <rect width="210" height="210" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="32" rx="8" fill="#1e3a8a"/>
    <path d="M0 24 h210 v8 H0 z" fill="#1e3a8a"/>
    <text x="105" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">users</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="120" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="600" fill="#38bdf8">UQ email</text> <text x="120" y="74" font-size="10" fill="#94a3b8">VARCHAR(255)</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    password</text> <text x="120" y="96" font-size="10" fill="#94a3b8">VARCHAR(255)</text>
    <text x="15" y="118" font-size="11" fill="#cbd5e1">    first_name</text> <text x="120" y="118" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="15" y="140" font-size="11" fill="#cbd5e1">    last_name</text> <text x="120" y="140" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="15" y="162" font-size="11" fill="#cbd5e1">    role</text> <text x="120" y="162" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="15" y="184" font-size="11" fill="#64748b">    created_at</text> <text x="120" y="184" font-size="10" fill="#64748b">TIMESTAMPTZ</text>
    <text x="15" y="200" font-size="11" fill="#64748b">    updated_at</text> <text x="120" y="200" font-size="10" fill="#64748b">TIMESTAMPTZ</text>
  </g>

  <!-- ==================== TABLE: ORDERS ==================== -->
  <g transform="translate(40, 400)">
    <rect width="210" height="230" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="32" rx="8" fill="#312e81"/>
    <path d="M0 24 h210 v8 H0 z" fill="#312e81"/>
    <text x="105" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">orders</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="120" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="700" fill="#a78bfa">FK  user_id</text> <text x="120" y="74" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    status</text> <text x="120" y="96" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="15" y="118" font-size="11" fill="#cbd5e1">    total_amount</text> <text x="120" y="118" font-size="10" fill="#94a3b8">DECIMAL(10,2)</text>
    <text x="15" y="140" font-size="11" fill="#cbd5e1">    shipping_addr</text> <text x="120" y="140" font-size="10" fill="#94a3b8">TEXT</text>
    <text x="15" y="162" font-size="11" fill="#64748b">    created_at</text> <text x="120" y="162" font-size="10" fill="#64748b">TIMESTAMPTZ</text>
    <text x="15" y="184" font-size="11" fill="#64748b">    updated_at</text> <text x="120" y="184" font-size="10" fill="#64748b">TIMESTAMPTZ</text>

    <rect x="10" y="196" width="190" height="24" rx="4" fill="#1e1b4b"/>
    <text x="105" y="212" font-size="9" fill="#a5b4fc" text-anchor="middle">INDEX (user_id, status)</text>
  </g>

  <!-- ==================== TABLE: ORDER_ITEMS ==================== -->
  <g transform="translate(360, 420)">
    <rect width="220" height="200" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="32" rx="8" fill="#4c1d95"/>
    <path d="M0 24 h220 v8 H0 z" fill="#4c1d95"/>
    <text x="110" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">order_items</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="120" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="700" fill="#a78bfa">FK  order_id</text> <text x="120" y="74" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="96" font-size="11" font-weight="700" fill="#a78bfa">FK  product_id</text> <text x="120" y="96" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="118" font-size="11" fill="#cbd5e1">    quantity</text> <text x="120" y="118" font-size="10" fill="#94a3b8">INTEGER &gt; 0</text>
    <text x="15" y="140" font-size="11" fill="#cbd5e1">    unit_price</text> <text x="120" y="140" font-size="10" fill="#94a3b8">DECIMAL(10,2)</text>
    <text x="15" y="162" font-size="11" fill="#cbd5e1">    total_price</text> <text x="120" y="162" font-size="10" fill="#94a3b8">DECIMAL(10,2)</text>

    <rect x="10" y="172" width="200" height="20" rx="4" fill="#2e1065"/>
    <text x="110" y="186" font-size="8" fill="#ddd6fe" text-anchor="middle">INDEX (order_id, product_id)</text>
  </g>

  <!-- ==================== TABLE: PRODUCTS ==================== -->
  <g transform="translate(360, 140)">
    <rect width="220" height="230" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="32" rx="8" fill="#064e3b"/>
    <path d="M0 24 h220 v8 H0 z" fill="#064e3b"/>
    <text x="110" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">products</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="120" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" fill="#cbd5e1">    name</text> <text x="120" y="74" font-size="10" fill="#94a3b8">VARCHAR(255)</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    price</text> <text x="120" y="96" font-size="10" fill="#94a3b8">DECIMAL(10,2)</text>
    <text x="15" y="118" font-size="11" font-weight="700" fill="#a78bfa">FK  category_id</text> <text x="120" y="118" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="140" font-size="11" font-weight="600" fill="#38bdf8">UQ sku</text> <text x="120" y="140" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="15" y="162" font-size="11" fill="#cbd5e1">    image_url</text> <text x="120" y="162" font-size="10" fill="#94a3b8">TEXT</text>
    <text x="15" y="184" font-size="11" fill="#cbd5e1">    is_active</text> <text x="120" y="184" font-size="10" fill="#94a3b8">BOOLEAN</text>
    <text x="15" y="202" font-size="11" fill="#64748b">    created_at</text> <text x="120" y="202" font-size="10" fill="#64748b">TIMESTAMPTZ</text>

    <rect x="10" y="210" width="200" height="15" rx="3" fill="#064e3b"/>
    <text x="110" y="221" font-size="8" fill="#a7f3d0" text-anchor="middle">INDEX (sku, category_id, is_active)</text>
  </g>

  <!-- ==================== TABLE: CATEGORIES ==================== -->
  <g transform="translate(710, 140)">
    <rect width="250" height="130" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#155e75"/>
    <path d="M0 24 h250 v8 H0 z" fill="#155e75"/>
    <text x="125" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">categories</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="140" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="600" fill="#38bdf8">UQ name</text> <text x="140" y="74" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    description</text> <text x="140" y="96" font-size="10" fill="#94a3b8">TEXT</text>
    <text x="15" y="118" font-size="11" fill="#64748b">    created_at</text> <text x="140" y="118" font-size="10" fill="#64748b">TIMESTAMPTZ</text>
  </g>

  <!-- ==================== TABLE: INVENTORY ==================== -->
  <g transform="translate(710, 310)">
    <rect width="250" height="180" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#713f12"/>
    <path d="M0 24 h250 v8 H0 z" fill="#713f12"/>
    <text x="125" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">inventory</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="140" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="700" fill="#a78bfa">FK  product_id</text> <text x="140" y="74" font-size="10" fill="#94a3b8">INTEGER UNIQUE</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    quantity</text> <text x="140" y="96" font-size="10" fill="#94a3b8">INTEGER &gt;= 0</text>
    <text x="15" y="118" font-size="11" fill="#cbd5e1">    reserved_qty</text> <text x="140" y="118" font-size="10" fill="#94a3b8">INTEGER &gt;= 0</text>
    <text x="15" y="140" font-size="11" fill="#cbd5e1">    min_stock_level</text> <text x="140" y="140" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="162" font-size="11" fill="#64748b">    last_restocked</text> <text x="140" y="162" font-size="10" fill="#64748b">TIMESTAMPTZ</text>

    <rect x="10" y="168" width="230" height="10" fill="#713f12" rx="2"/>
  </g>

  <!-- ==================== TABLE: INVENTORY_TRANSACTIONS ==================== -->
  <g transform="translate(710, 520)">
    <rect width="250" height="140" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" fill="#7c2d12"/>
    <path d="M0 24 h250 v8 H0 z" fill="#7c2d12"/>
    <text x="125" y="21" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">inventory_transactions</text>

    <text x="15" y="52" font-size="11" font-weight="700" fill="#fbbf24">PK  id</text> <text x="140" y="52" font-size="10" fill="#94a3b8">SERIAL</text>
    <text x="15" y="74" font-size="11" font-weight="700" fill="#a78bfa">FK  product_id</text> <text x="140" y="74" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="96" font-size="11" fill="#cbd5e1">    type</text> <text x="140" y="96" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="15" y="118" font-size="11" fill="#cbd5e1">    quantity</text> <text x="140" y="118" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="15" y="132" font-size="10" fill="#64748b">    reference, created_at</text>
  </g>

  <!-- ==================== RELATIONSHIP LINES ==================== -->
  <!-- users -> orders (1 to Many) -->
  <path d="M 145 350 L 145 400" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#dot)" marker-end="url(#crow)"/>
  <text x="155" y="380" font-size="9" fill="#38bdf8">1 : N</text>

  <!-- orders -> order_items (1 to Many) -->
  <path d="M 250 510 L 360 510" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#dot)" marker-end="url(#crow)"/>
  <text x="300" y="500" font-size="9" fill="#38bdf8">1 : N</text>

  <!-- products -> order_items (1 to Many) -->
  <path d="M 470 370 L 470 420" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#dot)" marker-end="url(#crow)"/>
  <text x="480" y="400" font-size="9" fill="#38bdf8">1 : N</text>

  <!-- categories -> products (1 to Many) -->
  <path d="M 710 200 L 580 200" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#dot)" marker-end="url(#crow)"/>
  <text x="640" y="190" font-size="9" fill="#38bdf8">1 : N</text>

  <!-- products -> inventory (1 to 1) -->
  <path d="M 580 340 L 710 340" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#dot)" marker-end="url(#dot)"/>
  <text x="635" y="330" font-size="9" fill="#38bdf8">1 : 1 (UNIQUE)</text>

  <!-- products -> inventory_transactions (1 to Many) -->
  <path d="M 530 370 L 530 570 L 710 570" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-start="url(#dot)" marker-end="url(#crow)"/>
  <text x="590" y="560" font-size="9" fill="#38bdf8">1 : N</text>
</svg>
